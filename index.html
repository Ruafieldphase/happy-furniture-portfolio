<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="행복나무공방의 향기 주머니부터 2027 양의 해 연필꽂이까지, 여섯 가지 작품을 만나보세요.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="행복나무공방">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f7f4ed">
  <title>행복나무공방 · 작품 포트폴리오</title>
  <link rel="icon" href="assets/happy_furniture_ci_symbol_vector.svg?v=transparent" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=booth24">
  <script defer src="assets/particle-samples.js?v=effectcraft"></script>
  <script defer src="assets/particle-lightness.js?v=effectcraft"></script>
  <script defer src="portfolio.js?v=booth24"></script>
</head>
<body>
  <header class="masthead page-width">
    <div class="identity">
      <img class="identity-mark" src="assets/happy_furniture_ci_symbol_vector.svg?v=transparent" alt="">
      <img class="identity-name" src="assets/happy_furniture_wordmark_vector.svg?v=transparent" alt="행복나무공방">
    </div>
    <div class="display-controls">
      <label class="motion-control">
        <input type="checkbox" id="motion" checked>
        <span class="switch" aria-hidden="true"></span>
        <span>전환 효과</span>
      </label>
      <button type="button" id="fullscreen">전체 화면</button>
    </div>
  </header>

  <main class="page-width">
    <section class="showcase" id="showcase" aria-label="선택한 작품" aria-roledescription="슬라이드">
      <div class="project-name">
        <p class="project-tag" id="tag">편백 향기 오브제 · 답례품</p>
        <h1 id="title">숲결</h1>
      </div>
      <figure class="visual" id="visual">
        <img id="photo" src="assets/01-soopgyeol.webp?v=effectcraft" alt="편백나무 칩을 담은 분홍빛 향기 주머니와 숲결 패키지" width="898" height="898" fetchpriority="high">
      </figure>
      <div class="project-info" id="details">
        <p id="description">편백나무 칩을 담아 옷장이나 서랍에 은은한 나무 향을 더해요.</p>
        <dl class="product-size"><dt>크기</dt><dd id="size">사과형 몸통 지름 약 7~9 cm (시안 기준)</dd></dl>
      </div>
      <canvas id="particles" aria-hidden="true" hidden></canvas>
    </section>

    <nav class="collection" aria-labelledby="collection-heading">
      <div class="collection-bar">
        <h2 id="collection-heading">상품 선택</h2>
        <div class="project-controls">
          <button type="button" id="previous">이전 작품</button>
          <button type="button" id="autoplay">일시 정지</button>
          <select id="hold-duration" aria-label="상품 정지 시간">
            <option value="3">3초 정지</option>
            <option value="6">6초 정지</option>
            <option value="10" selected>10초 정지</option>
            <option value="15">15초 정지</option>
            <option value="20">20초 정지</option>
            <option value="30">30초 정지</option>
          </select>
          <button type="button" id="next">다음 작품</button>
        </div>
      </div>
      <ul id="works"></ul>
    </nav>
    <p class="sr-only" id="announcement" role="status" aria-atomic="true"></p>
  </main>
</body>
</html>
